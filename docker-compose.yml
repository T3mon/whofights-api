# Explicit so containers are named whofights-api-1, whofights-auth-1, etc.
# instead of taking the folder name as a prefix.
name: whofights

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whofights
      POSTGRES_USER: whofights
      POSTGRES_PASSWORD: whofights
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whofights -d whofights"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=whofights;Username=whofights;Password=whofights"
      ASPNETCORE_ENVIRONMENT: Production
      # Must match auth's Jwt__SigningKey exactly - this is the service that
      # validates the tokens auth mints, not one that mints its own.
      Jwt__SigningKey: "local-dev-signing-key-do-not-use-elsewhere"
      # Cors:AllowedOrigins only exists in appsettings.Development.json,
      # which doesn't load under ASPNETCORE_ENVIRONMENT=Production - without
      # this the browser's own fetch calls get silently CORS-blocked (curl
      # never notices, CORS is enforced client-side only).
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: Dockerfile.Sync
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=whofights;Username=whofights;Password=whofights"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot like sync: `docker compose run --rm notifications`. On Render
  # this is its own cron job every half hour; locally you run it by hand.
  notifications:
    build:
      context: .
      dockerfile: Dockerfile.Notifications
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=whofights;Username=whofights;Password=whofights"
      # Mails through the same Resend key auth uses (see below). Links point
      # at the local frontend and the api container.
      Resend__ApiKey: "${RESEND_API_KEY}"
      Notifications__FrontendBaseUrl: "http://localhost:5173"
      Notifications__ApiBaseUrl: "http://localhost:8080"
      # "true" makes every kind due right now instead of waiting for its
      # moment (the sent-log still applies) - for trying it out.
      Notifications__Force: "${NOTIFICATIONS_FORCE:-false}"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: Dockerfile.Auth
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=whofights;Username=whofights;Password=whofights"
      # Local-only throwaway key, same spirit as the Postgres password above -
      # never reuse this for staging/production, those get their own via Render env vars.
      Jwt__SigningKey: "local-dev-signing-key-do-not-use-elsewhere"
      ASPNETCORE_ENVIRONMENT: Production
      # The frontend isn't part of this compose stack (it's a separate repo,
      # run with `npm run dev`) - this is just where confirmation-email
      # links point so they land on its confirm-email page.
      Frontend__BaseUrl: "http://localhost:5173"
      # Real key from .env (gitignored, see .env.example) - the shared
      # sandbox sender only delivers to your own Resend account email
      # until a domain is verified, which is fine for local testing.
      Resend__ApiKey: "${RESEND_API_KEY}"
      # Same reasoning as api's Cors__AllowedOrigins above.
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
